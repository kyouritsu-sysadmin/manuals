name: Build and publish document library

on:
  pull_request:
    paths:
      - "my-docs/**"
      - "portal/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-docs/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check types and catalog
        run: npm run typecheck
      - name: Build and check company home
        run: npm run build:portal && node ../portal/scripts/check.mjs
      - name: Build static site
        run: npm run build
      - name: Check routes and attachments
        run: npm run check:build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: my-docs/build

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
